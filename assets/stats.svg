<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace">
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#0c1119"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1d2733" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <clipPath id="avatarClip">
      <circle cx="70" cy="70" r="54"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1200" height="150" rx="14" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="150" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="150" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="13.5" fill="none" stroke="#1d2733"/>
  
    <g transform="translate(50,40)">
      <text x="0" y="0" fill="#69707c" font-size="12" letter-spacing="2">STARS</text>
      <text x="0" y="52" fill="#d6dee7" font-size="42" font-weight="700">3</text>
      <rect x="0" y="66" width="235" height="3" rx="1.5" fill="url(#accentGrad)"/>
    </g>
    <g transform="translate(325,40)">
      <text x="0" y="0" fill="#69707c" font-size="12" letter-spacing="2">REPOS</text>
      <text x="0" y="52" fill="#d6dee7" font-size="42" font-weight="700">10</text>
      <rect x="0" y="66" width="235" height="3" rx="1.5" fill="url(#accentGrad)"/>
    </g>
    <g transform="translate(600,40)">
      <text x="0" y="0" fill="#69707c" font-size="12" letter-spacing="2">FORKS</text>
      <text x="0" y="52" fill="#d6dee7" font-size="42" font-weight="700">2</text>
      <rect x="0" y="66" width="235" height="3" rx="1.5" fill="url(#accentGrad)"/>
    </g>
    <g transform="translate(875,40)">
      <text x="0" y="0" fill="#69707c" font-size="12" letter-spacing="2">COMMITS (1Y)</text>
      <text x="0" y="52" fill="#d6dee7" font-size="42" font-weight="700">400</text>
      <rect x="0" y="66" width="235" height="3" rx="1.5" fill="url(#accentGrad)"/>
    </g>
</svg>